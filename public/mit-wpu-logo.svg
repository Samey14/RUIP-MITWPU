<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Outer Ring Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED48F" />
      <stop offset="25%" stop-color="#CFA145" />
      <stop offset="50%" stop-color="#F5E4B3" />
      <stop offset="75%" stop-color="#B88628" />
      <stop offset="100%" stop-color="#936814" />
    </linearGradient>
    <filter id="softGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer White Circle with Gold Border -->
  <circle cx="150" cy="150" r="144" fill="#FFFFFF" stroke="url(#goldRing)" stroke-width="8" filter="url(#softGlow)" />
  <circle cx="150" cy="150" r="139" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.6" />

  <!-- DOME BUILDING (Navy Blue: #192A56 / #162447) -->
  <g stroke="#182C54" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Spire / Finial -->
    <path d="M150,42 L150,68" stroke-width="2.5" />
    <circle cx="150" cy="40" r="3.2" fill="#182C54" stroke-width="1" />
    <path d="M144,53 L156,53" stroke-width="2" />
    <path d="M142,61 L158,61" stroke-width="2" />
    <path d="M138,68 L162,68" stroke-width="2.5" fill="#182C54" />

    <!-- Main Outer Dome Shell -->
    <path d="M78,142 C78,86 110,68 150,68 C190,68 222,86 222,142" stroke-width="3.2" />

    <!-- Dome Ribs (Curved Meridian Arches) -->
    <!-- Center meridian -->
    <path d="M150,68 L150,142" stroke-width="2.2" />
    <!-- Left inner rib -->
    <path d="M150,68 C132,84 122,108 120,142" stroke-width="2" />
    <!-- Right inner rib -->
    <path d="M150,68 C168,84 178,108 180,142" stroke-width="2" />
    <!-- Left middle rib -->
    <path d="M150,68 C116,86 98,110 96,142" stroke-width="2" />
    <!-- Right middle rib -->
    <path d="M150,68 C184,86 202,110 204,142" stroke-width="2" />

    <!-- Horizontal Dome Waist Bands -->
    <path d="M76,142 L224,142" stroke-width="3" />
    <path d="M74,146 L226,146" stroke-width="2" />

    <!-- Rotunda Colonnade Drum Level -->
    <!-- Colonnade Top Cornice -->
    <rect x="70" y="146" width="160" height="4" fill="#182C54" stroke="none" />

    <!-- Vertical Columns / Pillars (15 Pillars across drum) -->
    <g stroke-width="2.2">
      <line x1="75" y1="150" x2="75" y2="164" />
      <line x1="85" y1="150" x2="85" y2="164" />
      <line x1="95" y1="150" x2="95" y2="164" />
      <line x1="105" y1="150" x2="105" y2="164" />
      <line x1="115" y1="150" x2="115" y2="164" />
      <line x1="125" y1="150" x2="125" y2="164" />
      <line x1="135" y1="150" x2="135" y2="164" />
      <line x1="145" y1="150" x2="145" y2="164" />
      <line x1="155" y1="150" x2="155" y2="164" />
      <line x1="165" y1="150" x2="165" y2="164" />
      <line x1="175" y1="150" x2="175" y2="164" />
      <line x1="185" y1="150" x2="185" y2="164" />
      <line x1="195" y1="150" x2="195" y2="164" />
      <line x1="205" y1="150" x2="205" y2="164" />
      <line x1="215" y1="150" x2="215" y2="164" />
      <line x1="225" y1="150" x2="225" y2="164" />
    </g>

    <!-- Base Plinth & Balustrade Terrace -->
    <rect x="68" y="164" width="164" height="3" fill="#182C54" stroke="none" />
    <rect x="64" y="167" width="172" height="4.5" fill="#182C54" stroke="none" />
  </g>

  <!-- Registered Trademark Sign ® -->
  <text x="236" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#182C54" text-anchor="middle">®</text>

  <!-- "MIT-WPU" in Vivid Red Bold -->
  <text x="150" y="210"
        font-family="system-ui, -apple-system, 'Arial Black', sans-serif"
        font-size="37"
        font-weight="900"
        fill="#DC2626"
        letter-spacing="1"
        text-anchor="middle">MIT-WPU</text>

  <!-- Sanskrit Devanagari Slogan: ॥ विश्वशान्तिर्ध्रुवं ध्रुवा ॥ -->
  <text x="150" y="240"
        font-family="'Noto Sans Devanagari', 'Mangal', 'Devanagari MT', system-ui, sans-serif"
        font-size="15"
        font-weight="700"
        fill="#182C54"
        letter-spacing="0.5"
        text-anchor="middle">&#2405; &#2357;&#2367;&#2358;&#2381;&#2357;&#2358;&#2366;&#2344;&#2381;&#2340;&#2367;&#2352;&#2381;&#2343;&#2381;&#2352;&#2369;&#2357;&#2306; &#2343;&#2381;&#2352;&#2369;&#2357;&#2366; &#2405;</text>
</svg>
