<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="100%" height="100%">
  <!-- Left Side: Dome + MIT-WPU + Motto -->
  <g transform="translate(10, 5)">
    <!-- Dome Drawing -->
    <g stroke="#182C54" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M75,18 L75,34" stroke-width="1.8" />
      <circle cx="75" cy="17" r="2.2" fill="#182C54" stroke-width="0.8" />
      <path d="M70,24 L80,24" stroke-width="1.4" />
      <path d="M69,30 L81,30" stroke-width="1.4" />
      <path d="M66,34 L84,34" stroke-width="2" fill="#182C54" />

      <path d="M26,82 C26,45 50,34 75,34 C100,34 124,45 124,82" stroke-width="2.2" />
      <path d="M75,34 L75,82" stroke-width="1.6" />
      <path d="M75,34 C62,45 55,60 54,82" stroke-width="1.4" />
      <path d="M75,34 C88,45 95,60 96,82" stroke-width="1.4" />
      <path d="M75,34 C49,46 38,62 36,82" stroke-width="1.4" />
      <path d="M75,34 C101,46 112,62 114,82" stroke-width="1.4" />

      <path d="M24,82 L126,82" stroke-width="2" />
      <path d="M22,85 L128,85" stroke-width="1.5" />

      <rect x="20" y="85" width="110" height="3" fill="#182C54" stroke="none" />

      <!-- Columns -->
      <g stroke-width="1.6">
        <line x1="24" y1="88" x2="24" y2="98" />
        <line x1="31" y1="88" x2="31" y2="98" />
        <line x1="38" y1="88" x2="38" y2="98" />
        <line x1="45" y1="88" x2="45" y2="98" />
        <line x1="52" y1="88" x2="52" y2="98" />
        <line x1="59" y1="88" x2="59" y2="98" />
        <line x1="66" y1="88" x2="66" y2="98" />
        <line x1="73" y1="88" x2="73" y2="98" />
        <line x1="80" y1="88" x2="80" y2="98" />
        <line x1="87" y1="88" x2="87" y2="98" />
        <line x1="94" y1="88" x2="94" y2="98" />
        <line x1="101" y1="88" x2="101" y2="98" />
        <line x1="108" y1="88" x2="108" y2="98" />
        <line x1="115" y1="88" x2="115" y2="98" />
        <line x1="122" y1="88" x2="122" y2="98" />
      </g>

      <rect x="18" y="98" width="114" height="2" fill="#182C54" stroke="none" />
      <rect x="15" y="100" width="120" height="3.5" fill="#182C54" stroke="none" />
    </g>

    <!-- Registered trademark -->
    <text x="135" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#182C54">®</text>

    <!-- MIT-WPU Red Text -->
    <text x="75" y="126"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="25"
          font-weight="900"
          fill="#DC2626"
          letter-spacing="0.5"
          text-anchor="middle">MIT-WPU</text>

    <!-- Sanskrit Motto -->
    <text x="75" y="143"
          font-family="'Noto Sans Devanagari', 'Mangal', system-ui, sans-serif"
          font-size="10.5"
          font-weight="700"
          fill="#182C54"
          letter-spacing="0.3"
          text-anchor="middle">&#2405; &#2357;&#2367;&#2358;&#2381;&#2357;&#2358;&#2366;&#2344;&#2381;&#2340;&#2367;&#2352;&#2381;&#2343;&#2381;&#2352;&#2369;&#2357;&#2306; &#2343;&#2381;&#2352;&#2369;&#2357;&#2366; &#2405;</text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="172" y1="28" x2="172" y2="132" stroke="#94A3B8" stroke-width="1.2" />

  <!-- Right Side: University Typography -->
  <g transform="translate(192, 0)">
    <!-- Subtitle: Dr. Vishwanath Karad -->
    <text x="0" y="52"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="15"
          font-weight="500"
          fill="#334155">Dr. Vishwanath Karad</text>

    <!-- Main Title: MIT WORLD PEACE UNIVERSITY | PUNE -->
    <text x="0" y="82"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="24"
          font-weight="800"
          fill="#0C2340"
          letter-spacing="0.8">MIT WORLD PEACE</text>
    
    <text x="0" y="112"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="24"
          font-weight="800"
          fill="#0C2340"
          letter-spacing="0.8">UNIVERSITY <tspan fill="#94A3B8" font-weight="400">|</tspan> <tspan fill="#64748B" font-size="19" font-weight="600">PUNE</tspan></text>

    <!-- Baseline: TECHNOLOGY, RESEARCH, SOCIAL INNOVATION & PARTNERSHIPS -->
    <text x="0" y="132"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="9.5"
          font-weight="700"
          fill="#475569"
          letter-spacing="1">TECHNOLOGY, RESEARCH, SOCIAL INNOVATION &amp; PARTNERSHIPS</text>
  </g>
</svg>
